name: Update DefiniDEX Data

on:
  schedule:
    - cron: '0 3 * * 1' # VGC Teams Update: Every Monday at 3:00 AM UTC
    - cron: '0 4 * * *' # TCG Prices Update: Daily at 4:00 AM UTC
    - cron: '0 2 * * *' # News Update: Daily at 2:00 AM UTC
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of data to update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vgc
          - tcg
          - news

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update VGC Data
        if: github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'vgc' || github.event_name == 'schedule'
        run: |
          echo "Updating VGC data..."
          npm run update-vgc || echo "VGC meta update failed, continuing..."
          npm run update-vgc-teams || echo "VGC teams update failed, continuing..."
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Update TCG Prices
        if: github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'tcg' || github.event_name == 'schedule'
        run: |
          echo "Updating TCG prices..."
          npm run update-tcg-prices || echo "TCG update failed, continuing..."

      - name: Update News
        if: github.event.inputs.update_type == 'all' || github.event.inputs.update_type == 'news' || github.event_name == 'schedule'
        run: |
          echo "Updating news..."
          npm run fetch-news || echo "News update failed, continuing..."

      - name: Update metadata timestamps
        run: |
          node -e "
            const fs = require('fs');
            const metadata = {
              lastUpdated: new Date().toISOString(),
              vgc: { lastUpdated: new Date().toISOString(), source: 'smogon' },
              tcg: { lastUpdated: new Date().toISOString(), source: 'pokemontcg' },
              news: { lastUpdated: new Date().toISOString(), source: 'rss' }
            };
            fs.writeFileSync('public/data/metadata.json', JSON.stringify(metadata, null, 2));
          "

      - name: Commit directly
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/ src/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update data $(date '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

      - name: Build Project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAba3e8WWX5SegT_E4Gx32X7nmuhUWR-5w"
          VITE_FIREBASE_AUTH_DOMAIN: "definidex.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "definidex"
          VITE_FIREBASE_STORAGE_BUCKET: "definidex.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "780834154965"
          VITE_FIREBASE_APP_ID: "1:780834154965:web:5b2c6a6ac5b2a53c38355c"
          VITE_GA_MEASUREMENT_ID: ""

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEFINIDEX }}
          channelId: live
          projectId: definidex
